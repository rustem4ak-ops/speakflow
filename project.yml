name: SpeakFlow
options:
  bundleIdPrefix: com.rustem4ak
  deploymentTarget:
    iOS: "17.0"
targets:
  SpeakFlow:
    type: application
    platform: iOS
    sources:
      - path: SpeakFlow
    resources:
      - path: SpeakFlow/Content
    info:
      path: SpeakFlow/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rustem4ak.speakflow
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: ""
