name: iOS Build

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build for iOS Simulator
        run: |
          xcodebuild             -project SpeakFlow.xcodeproj             -scheme SpeakFlow             -sdk iphonesimulator             -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=26.5'             CODE_SIGNING_ALLOWED=NO             -derivedDataPath build             build
      - name: Validate lesson catalog
        run: test -f SpeakFlow/Content/lessons.json
      - name: Package simulator app
        run: |
          cd build/Build/Products/Debug-iphonesimulator
          zip -r SpeakFlow-iOS-Simulator.zip SpeakFlow.app
      - name: Upload simulator build
        uses: actions/upload-artifact@v4
        with:
          name: SpeakFlow-iOS-Simulator
          path: build/Build/Products/Debug-iphonesimulator/SpeakFlow-iOS-Simulator.zip
          retention-days: 14
