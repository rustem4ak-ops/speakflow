name: iOS Build

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build for iOS Simulator
        run: |
          xcodebuild             -project SpeakFlow.xcodeproj             -scheme SpeakFlow             -sdk iphonesimulator             -destination 'platform=iOS Simulator,name=iPhone 16'             CODE_SIGNING_ALLOWED=NO             build
      - name: Validate lesson catalog
        run: test -f SpeakFlow/Content/lessons.json
