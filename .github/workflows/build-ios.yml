name: SpeakFlow iOS

on:
  push:
    branches: ["v1-foundation"]
  pull_request:
    branches: ["main", "v1-foundation"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for iOS Simulator
        run: |
          xcodebuild             -project SpeakFlow.xcodeproj             -scheme SpeakFlow             -sdk iphonesimulator             -configuration Debug             -destination 'generic/platform=iOS Simulator'             CODE_SIGNING_ALLOWED=NO             build
