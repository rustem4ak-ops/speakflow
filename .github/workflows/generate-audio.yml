name: Generate all SpeakFlow Kokoro audio

on:
  workflow_dispatch:
  push:
    paths:
      - "data.json"
      - "tools_generate_audio.py"
      - ".github/workflows/generate-audio.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system audio dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng

      - name: Install Kokoro
        run: |
          python -m pip install --upgrade pip
          pip install "kokoro>=0.9.4" soundfile numpy

      - name: Remove old audio
        run: |
          rm -f audio/*.wav
          rm -f audio/index.json
          mkdir -p audio

      - name: Generate all lesson audio
        run: |
          python tools_generate_audio.py

      - name: Check generated audio
        run: |
          echo "WAV files:"
          find audio -name "*.wav" | sort
          echo ""
          echo "Number of WAV files:"
          find audio -name "*.wav" | wc -l
          echo ""
          echo "Audio index:"
          ls -lh audio/index.json

      - name: Commit generated audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add audio/

          if git diff --cached --quiet; then
            echo "No audio changes."
          else
            git commit -m "Generate exact SpeakFlow 6.2 audio"
            git push
          fi
