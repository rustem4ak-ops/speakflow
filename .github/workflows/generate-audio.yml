name: Generate Kokoro audio

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Kokoro
        run: |
          python -m pip install --upgrade pip
          pip install "kokoro>=0.9.4" soundfile

      - name: Generate audio
        run: |
          mkdir -p audio

          python - <<'PY'
          from kokoro import KPipeline
          import soundfile as sf
          from pathlib import Path

          pipeline = KPipeline(lang_code="a")

          phrases = {
              "airport-1": "Hello, where is the check-in counter?",
              "airport-2": "I'd like to check in for my flight.",
              "airport-3": "Can I have a window seat, please?",
              "airport-4": "Where is the security checkpoint?",
              "airport-5": "What time does boarding start?"
          }

          out = Path("audio")

          for name, text in phrases.items():
              path = out / f"{name}.wav"

              if path.exists():
                  print(f"Already exists: {path}")
                  continue

              print(f"Generating: {text}")

              generator = pipeline(
                  text,
                  voice="af_heart",
                  speed=1.0
              )

              for _, _, audio in generator:
                  sf.write(path, audio, 24000)
                  break

              print(f"Saved: {path}")
          PY

      - name: Commit generated audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add audio/

          if git diff --cached --quiet; then
            echo "No new audio files."
          else
            git commit -m "Generate Kokoro lesson audio"
            git push
          fi
