<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080a0f"><title>SpeakFlow</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,system-ui,sans-serif;color:#fff;background:#080a0f}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#263149 0,#10131b 38%,#080a0f 72%);min-height:100vh}
.app{max-width:520px;margin:auto;min-height:100vh;padding:env(safe-area-inset-top) 18px calc(28px + env(safe-area-inset-bottom))}
header{display:flex;justify-content:space-between;align-items:center;padding:18px 2px 10px}.logo{font-size:23px;font-weight:800}.pill{background:#202633;border:1px solid #343b4a;border-radius:20px;padding:7px 11px;font-size:13px;color:#cfd6e5}
.progress{height:5px;background:#242a35;border-radius:8px;overflow:hidden;margin:12px 0 26px}.bar{height:100%;width:0;background:#fff;border-radius:8px;transition:.25s}
.card{background:rgba(20,24,33,.9);border:1px solid #2d3442;border-radius:28px;padding:26px 20px;box-shadow:0 18px 60px #0008}
h1{font-size:31px;line-height:1.1;margin:8px 0 12px}.sub{color:#9da7b8;line-height:1.45}.label{font-size:12px;color:#8993a7;text-transform:uppercase;letter-spacing:1.2px;font-weight:700}
.grid{display:grid;gap:12px;margin-top:20px}.lesson{padding:17px;border:1px solid #303746;background:#171c26;border-radius:18px;text-align:left;color:#fff}.lesson b{display:block;font-size:17px;margin-bottom:4px}.lesson span{color:#929caf;font-size:13px}
.btn{border:0;border-radius:18px;padding:16px 12px;font-size:16px;font-weight:750;color:#fff;background:#2a3140;width:100%;margin-top:12px}.primary{background:#fff;color:#080a0f}.mic{background:#586cf4;font-size:19px}.back{background:transparent;border:1px solid #333b4a}.phrase{font-size:30px;line-height:1.15;font-weight:750;letter-spacing:-.7px;margin:14px 0 10px}.translation{font-size:17px;color:#aeb7c7;min-height:27px}
.result{margin-top:16px;padding:15px;border-radius:17px;font-weight:700;border:1px solid #394150}.good{background:#12351f;border-color:#2d9b59}.bad{background:#3a1518;border-color:#c54d57}.score{font-size:42px;font-weight:850}.heard{font-size:13px;color:#c5cbd7;margin-top:5px;font-weight:500}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}.stat{background:#171c26;border-radius:17px;padding:15px}.stat b{font-size:25px;display:block}.stat span{color:#929caf;font-size:12px}.quiz{font-size:20px;line-height:1.5;margin:16px 0}.option{text-align:left;background:#171c26;border:1px solid #303746}.option.correct{background:#12351f;border-color:#2d9b59}.option.wrong{background:#3a1518;border-color:#c54d57}.tiny{font-size:13px;color:#818b9e;text-align:center;margin-top:16px}
</style></head>
<body><div class="app">
<header><div class="logo">SpeakFlow</div><div class="pill" id="level">A1</div></header>
<div class="progress"><div class="bar" id="bar"></div></div><main id="screen"></main>
</div>
<script>
const topics=[
["Everyday Life","Повседневная жизнь"],["Meeting People","Знакомство"],["Family","Семья"],["Home","Дом"],["Food & Cooking","Еда и готовка"],["Shopping","Покупки"],["Travel","Путешествия"],["Hotel","Отель"],["City","Город"],["Work","Работа"],["Phone & Messages","Телефон"],["Health","Здоровье"],["Weather","Погода"],["Time & Plans","Время и планы"],["Hobbies","Хобби"],["Study","Учёба"],["Technology","Технологии"],["Money","Деньги"],["Restaurant","Ресторан"],["Transport","Транспорт"],["Directions","Ориентация в городе"],["Social Life","Общение"],["Feelings","Чувства"],["Problems & Solutions","Проблемы"],["Future & Goals","Будущее"]];
const units=["Basics","Questions","Requests","Daily routine","Past experiences","Plans","Problems","Opinions","People","Places","Time","Money","Phone","Travel","Work","Home","Social life","Real conversation","Challenge","Review"];
const pairLines=[
"start my day~начать свой день;check my calendar~проверить календарь;prepare breakfast~приготовить завтрак;finish my first task~закончить первую задачу",
"ask your name~спросить ваше имя;talk about your hometown~поговорить о вашем родном городе;introduce myself~представиться;learn more about you~узнать больше о вас",
"call my sister~позвонить сестре;visit my parents~навестить родителей;help my brother~помочь брату;talk to my family~поговорить с семьёй",
"clean the kitchen~убрать кухню;repair the door~починить дверь;move the sofa~переставить диван;organize the living room~организовать гостиную",
"cook pasta~приготовить пасту;prepare the vegetables~подготовить овощи;make coffee~сделать кофе;serve dinner~подать ужин",
"buy a jacket~купить куртку;try on these shoes~примерить эти туфли;return the shirt~вернуть рубашку;order a backpack~заказать рюкзак",
"check my passport~проверить паспорт;book a flight~забронировать рейс;change my ticket~изменить билет;find my suitcase~найти чемодан",
"book a room~забронировать номер;request a towel~попросить полотенце;confirm my reservation~подтвердить бронирование;pay for my stay~заплатить за проживание",
"find the pharmacy~найти аптеку;visit the museum~посетить музей;use the post office~воспользоваться почтой;walk to the city center~дойти до центра города",
"finish the report~закончить отчёт;send the invoice~отправить счёт;check the schedule~проверить расписание;prepare the presentation~подготовить презентацию",
"send a message~отправить сообщение;receive a call~получить звонок;forward an email~переслать письмо;save the contact~сохранить контакт",
"book a doctor's appointment~записаться к врачу;describe my symptoms~описать свои симптомы;check the prescription~проверить рецепт;ask about the treatment~спросить о лечении",
"check the forecast~проверить прогноз;expect rain~ожидать дождь;enjoy the sunshine~насладиться солнечной погодой;prepare for cold weather~подготовиться к холодной погоде",
"plan tomorrow~запланировать завтрашний день;schedule a meeting~назначить встречу;confirm the plan~подтвердить план;change the schedule~изменить расписание",
"start running~начать бегать;practice the guitar~практиковаться на гитаре;watch a film~посмотреть фильм;learn a new skill~научиться новому навыку",
"study for an exam~готовиться к экзамену;review my notes~повторить свои записи;finish my homework~закончить домашнюю работу;improve my vocabulary~улучшить словарный запас",
"install an app~установить приложение;reset my password~сбросить пароль;connect to Wi-Fi~подключиться к Wi-Fi;update the software~обновить программное обеспечение",
"pay by card~оплатить картой;check the receipt~проверить чек;save money~сэкономить деньги;receive a payment~получить платёж",
"order a table~заказать столик;recommend a main course~порекомендовать основное блюдо;bring some water~принести воды;pay the bill~оплатить счёт",
"catch the bus~успеть на автобус;miss the train~пропустить поезд;take the metro~воспользоваться метро;wait for a taxi~подождать такси",
"find the station~найти станцию;reach the bridge~дойти до моста;walk to the museum~дойти до музея;cross the street~перейти улицу",
"invite a friend to dinner~пригласить друга на ужин;accept the invitation~принять приглашение;arrange a party~организовать вечеринку;enjoy the evening~насладиться вечером",
"feel happy~чувствовать себя счастливым;look tired~выглядеть уставшим;become more confident~стать увереннее;stay calm~оставаться спокойным",
"fix the mistake~исправить ошибку;report the delay~сообщить о задержке;explain the problem~объяснить проблему;solve the problem~решить проблему",
"plan a new job~запланировать новую работу;start a new project~начать новый проект;improve my English~улучшить английский;achieve my goal~достичь своей цели"
].map(x=>x.split(";").map(y=>y.split("~")));
const patterns=[
["I need to {a}.","Мне нужно {ar}."],["Can you help me {a}?","Можете помочь мне {ar}?"],["I'd like to {a}.","Я хотел бы {ar}."],["I have to {a} today.","Мне нужно {ar} сегодня."],["I'm going to {a} tomorrow.","Я собираюсь {ar} завтра."],["Could you {a}, please?","Не могли бы вы {ar}, пожалуйста?"],["When should I {a}?","Когда мне следует {ar}?"],["How can I {a}?","Как мне {ar}?"],["Where can I {a}?","Где я могу {ar}?"],["I usually {a} in the morning.","Обычно я {ar} утром."],["I don't usually {a}.","Я обычно не {ar}."],["I forgot to {a}.","Я забыл {ar}."],["Let's {a} first.","Давайте сначала {ar}."],["We should {a} before we leave.","Нам стоит {ar} перед уходом."],["We don't need to {a} yet.","Нам пока не нужно {ar}."],["I'm trying to {a}.","Я стараюсь {ar}."],["I'm ready to {a}.","Я готов {ar}."],["I can {a} if you want.","Я могу {ar}, если хотите."],["I'll {a} as soon as possible.","Я {ar} как можно скорее."],["I'll try to {a}.","Я постараюсь {ar}."],["I need more time to {a}.","Мне нужно больше времени, чтобы {ar}."],["I was able to {a}.","Мне удалось {ar}."],["Would you like me to {a}?","Хотите, чтобы я {ar}?"],["Do you want me to {a}?","Хотите, чтобы я {ar}?"],["Let me {a} first.","Дайте мне сначала {ar}."],["There's no need to {a}.","Нет необходимости {ar}."],["It would be great to {a}.","Было бы здорово {ar}."],["Can we {a} together?","Можем мы {ar} вместе?"],["I think we can {a}.","Думаю, мы можем {ar}."],["I don't think we should {a}.","Не думаю, что нам стоит {ar}."]
];
const times=[["this morning","сегодня утром"],["after lunch","после обеда"],["before work","до работы"],["after work","после работы"],["this evening","сегодня вечером"],["tomorrow morning","завтра утром"],["tomorrow afternoon","завтра днём"],["tomorrow evening","завтра вечером"],["this weekend","в эти выходные"],["next week","на следующей неделе"],["on Friday","в пятницу"],["on Saturday","в субботу"],["on Sunday","в воскресенье"],["during the day","в течение дня"],["later today","позже сегодня"],["right now","прямо сейчас"],["when I have time","когда у меня есть время"],["before dinner","до ужина"],["after dinner","после ужина"],["before I leave","перед тем как я уйду"]];
const places=[["at home","дома"],["at work","на работе"],["at the station","на станции"],["at the airport","в аэропорту"],["at a café","в кафе"],["at the store","в магазине"],["in the city center","в центре города"],["on the phone","по телефону"],["online","онлайн"],["with my family","с моей семьёй"]];
const LESSONS=[];
for(let n=1;n<=500;n++){const ti=(n-1)%25,u=Math.floor((n-1)/25)+1,l=n<=150?"A1":n<=300?"A2":n<=400?"B1":n<=475?"B2":"C1";LESSONS.push({number:n,level:l,topic:topics[ti][0],topicRu:topics[ti][1],unit:u,title:topics[ti][0]+" — "+units[u-1],description:topics[ti][1]+". Практика: "+units[u-1].toLowerCase()+"."});}
const state={lesson:Number(localStorage.getItem("sf.lesson")||1),level:localStorage.getItem("sf.level")||"A1",topic:"Все",index:0,pool:[],scores:[],quizIndex:0,quizScore:0};
const $=x=>document.getElementById(x),weak=()=>JSON.parse(localStorage.getItem("sf.weak")||"[]");
function save(){localStorage.setItem("sf.lesson",state.lesson);localStorage.setItem("sf.level",state.level)}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function prog(v){$("bar").style.width=v+"%"}
function speak(t){if(!("speechSynthesis"in window))return;const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.82;speechSynthesis.cancel();speechSynthesis.speak(u)}
function stats(){return{learned:+localStorage.getItem("sf.learned")||0,xp:+localStorage.getItem("sf.xp")||0,streak:+localStorage.getItem("sf.streak")||0}}
function phraseFor(n,j){const ti=(n-1)%25,u=Math.floor((n-1)/25)+1,[a,ar]=pairLines[ti][(j+u+ti)%4],[tm,tr]=times[(j+u+ti)%20],[pl,pr]=places[(j*3+u+ti)%10],[et,rt]=patterns[j%30];let en=et.replaceAll("{a}",a),ru=rt.replaceAll("{ar}",ar);const c=j%2?[pl,pr]:[tm,tr];en=c[0].charAt(0).toUpperCase()+c[0].slice(1)+", "+en;ru=c[1].charAt(0).toUpperCase()+c[1].slice(1)+", "+ru.charAt(0).toLowerCase()+ru.slice(1);return{id:"l"+String(n).padStart(3,"0")+"p"+String(j+1).padStart(2,"0"),english:en,translation:ru}}
function buildLesson(n){return Array.from({length:60},(_,j)=>phraseFor(n,j))}
function home(){state.stage="home";prog(0);const s=stats();$("levelPill").textContent=state.level;$("screen").innerHTML='<section class="card"><div class="eyebrow">ENGLISH SPEAKING TRAINER</div><h1>Учимся говорить английский естественно</h1><div class="sub">500 уроков · 30 000 уникальных фраз · повторение слабых мест · проверка знаний.</div><button class="btn primary" onclick="openLessons()">Начать обучение</button></section><div class="levels">'+["A1","A2","B1","B2","C1"].map(x=>'<button class="level '+(x===state.level?"active":"")+'" onclick="setLevel(\''+x+'\')">'+x+"</button>").join("")+'</div><section class="card"><div class="label">Сегодня</div><div class="stats"><div class="stat"><b>'+s.learned+'</b><span>фраз изучено</span></div><div class="stat"><b>'+s.xp+'</b><span>XP</span></div><div class="stat"><b>'+s.streak+'</b><span>дней серии</span></div></div></section><section class="card"><div class="label">Структура каждого урока</div><div class="sub">20 фраз на повторение → 40 новых → проверка знаний → результат.</div></section>'}
function setLevel(l){state.level=l;save();home()}
function openLessons(){const ts=["Все",...new Set(LESSONS.filter(x=>x.level===state.level).map(x=>x.topic))];renderLessons(ts[0])}
function renderLessons(topic){state.topic=topic;const ts=["Все",...new Set(LESSONS.filter(x=>x.level===state.level).map(x=>x.topic))],list=LESSONS.filter(x=>x.level===state.level&&(topic==="Все"||x.topic===topic));$("levelPill").textContent=state.level;$("screen").innerHTML='<button class="btn back" onclick="home()">← Главная</button><section class="card"><div class="eyebrow">УРОВЕНЬ '+state.level+'</div><h1>Уроки</h1><div class="sub">Полная программа: '+LESSONS.filter(x=>x.level===state.level).length+' уроков.</div></section><div class="filters">'+ts.map(t=>'<button class="filter '+(t===topic?"active":"")+'" onclick="renderLessons('+JSON.stringify(t)+')">'+t+"</button>").join("")+'</div><div class="grid">'+list.map(l=>'<button class="lesson" onclick="startLesson('+l.number+')"><span class="tag">'+l.level+" · УРОК "+l.number+'</span><b>'+esc(l.title)+'</b><span>'+esc(l.description)+'</span></button>').join("")+'</div>'}
function startLesson(n){state.lesson=n;save();state.index=0;state.scores=[];const all=buildLesson(n),w=weak(),review=w.slice(0,20);while(review.length<20)review.push(all[review.length]);state.pool=review.concat(all.slice(0,40));showPhrase()}
function showPhrase(){const p=state.pool[state.index],rev=state.index<20;prog(state.index/60*72);$("levelPill").textContent=(rev?"Повторение":"Новые")+" "+(state.index+1)+"/60";$("screen").innerHTML='<button class="btn back" onclick="openLessons()">← К урокам</button><section class="card"><div class="eyebrow">'+(rev?"ПОВТОРЕНИЕ":"НОВАЯ ФРАЗА")+" · "+(state.index+1)+" ИЗ 60"+'</div><div class="phrase">'+esc(p.english)+'</div><div class="translation" id="tr">Нажмите «Слушать», затем повторите фразу.</div><div class="audio"><div class="audioRow"><button class="play" onclick="listen()">▶</button><div class="audioText"><b>Английская озвучка</b><span>English (US) · озвучка устройства</span></div></div><button class="btn secondary" onclick="listen()">🔊 Слушать фразу</button></div><button class="btn mic" id="mic" onclick="record()">🎙 Повторить и проверить</button><div id="res"></div><button class="btn primary" id="next" onclick="nextPhrase()" disabled>Продолжить →</button></section><div class="tiny">85% и выше — зелёный результат. Это проверка совпадения распознанного текста, не фонемная оценка.</div>'}
function listen(){$("tr").textContent=state.pool[state.index].translation;speak(state.pool[state.index].english)}
let rec=null;
function record(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){finishScore(0,"Распознавание речи недоступно в этом браузере.");return}rec=new SR();rec.lang="en-US";rec.interimResults=false;rec.maxAlternatives=1;$("mic").disabled=true;$("mic").textContent="⏹ Слушаю…";rec.onresult=e=>finishScore(calc(state.pool[state.index].english,e.results[0][0].transcript),e.results[0][0].transcript);rec.onerror=()=>finishScore(0,"Не удалось распознать речь.");rec.onend=()=>{if($("mic")){$("mic").disabled=false;$("mic").textContent="🎙 Повторить и проверить"}};rec.start()}
function calc(ref,heard){const a=ref.toLowerCase().replace(/[^a-z0-9 ]/g,"").split(/\s+/).filter(Boolean),b=heard.toLowerCase().replace(/[^a-z0-9 ]/g,"").split(/\s+/).filter(Boolean);let same=0;for(let i=0;i<Math.max(a.length,b.length);i++)if(a[i]&&a[i]===b[i])same++;return Math.max(0,Math.min(100,Math.round(same/Math.max(a.length,b.length,1)*100)))}
function finishScore(score,heard){const p=state.pool[state.index];state.scores[state.index]=score;let a=weak().filter(x=>x.id!==p.id);if(score<100)a.unshift({id:p.id,score,english:p.english,translation:p.translation});localStorage.setItem("sf.weak",JSON.stringify(a.sort((x,y)=>x.score-y.score).slice(0,300)));$("tr").textContent=p.translation;$("res").innerHTML='<div class="result '+(score>=85?"good":"bad")+'"><div class="score">'+score+'%</div><div>'+(score>=85?"Правильно":"Нужно повторить")+'</div><div class="heard">'+esc(heard)+'</div></div>';$("next").disabled=false}
function nextPhrase(){if(state.index<59){state.index++;showPhrase()}else startQuiz()}
function startQuiz(){state.quizIndex=0;state.quizScore=0;showQuiz()}
function showQuiz(){const idx=(state.quizIndex*5+7)%60,p=state.pool[idx],opts=[p.translation,state.pool[(idx+1)%60].translation,state.pool[(idx+2)%60].translation].sort(()=>Math.random()-.5);state.quiz={p,opts};prog(72+state.quizIndex/10*28);$("levelPill").textContent="Проверка "+(state.quizIndex+1)+"/10";$("screen").innerHTML='<section class="card"><div class="eyebrow">ПРОВЕРКА ЗНАНИЙ · '+(state.quizIndex+1)+"/10"+'</div><div class="quiz">'+esc(p.english)+'</div>'+opts.map(o=>'<button class="btn option" onclick="answer(this,'+JSON.stringify(o)+','+JSON.stringify(p.translation)+')">'+esc(o)+"</button>").join("")+'</section>'}
function answer(btn,o,c){document.querySelectorAll(".option").forEach(x=>x.disabled=true);if(o===c){btn.classList.add("correct");state.quizScore++}else{btn.classList.add("wrong");document.querySelectorAll(".option").forEach(x=>{if(x.textContent===c)x.classList.add("correct")})}setTimeout(()=>{if(state.quizIndex<9){state.quizIndex++;showQuiz()}else finishLesson()},550)}
function finishLesson(){const avg=Math.round(state.scores.reduce((a,b)=>a+b,0)/60),perfect=state.scores.filter(x=>x===100).length,s=stats();localStorage.setItem("sf.learned",s.learned+60);localStorage.setItem("sf.xp",s.xp+Math.round(avg/10)+state.quizScore*5);prog(100);$("screen").innerHTML='<section class="card"><div class="eyebrow">УРОК ЗАВЕРШЁН</div><h1>Результат</h1><div class="stats"><div class="stat"><b>'+avg+'%</b><span>средняя речь</span></div><div class="stat"><b>'+perfect+'/60</b><span>идеально</span></div><div class="stat"><b>'+state.quizScore+'/10</b><span>знания</span></div></div><div class="sub" style="margin-top:18px">Все фразы ниже 100% сохранены для будущего повторения.</div><button class="btn primary" onclick="nextLesson()">Следующий урок →</button><button class="btn back" onclick="openLessons()">К списку уроков</button></section>'}
function nextLesson(){state.lesson=state.lesson%500+1;state.level=LESSONS[state.lesson-1].level;save();startLesson(state.lesson)}
home();</script></body></html>
