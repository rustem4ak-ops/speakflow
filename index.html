<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="styles.css?v=37">
<title>SpeakFlow</title>
<style>
#boot{position:fixed;inset:0;background:#080c18;color:#f7f8fc;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;z-index:99999}
#bootBox{max-width:520px;background:#101627;border:1px solid #29344f;border-radius:20px;padding:24px}
#bootTitle{font-size:24px;font-weight:800;margin-bottom:8px}
#bootMsg{color:#aeb7cb;line-height:1.5}
#bootErr{margin-top:12px;text-align:left;white-space:pre-wrap;color:#ffb2b8;font-size:12px;display:none;background:#21151a;border-radius:12px;padding:12px}
</style>
</head>
<body>
<div id="boot"><div id="bootBox"><div id="bootTitle">SpeakFlow</div><div id="bootMsg">Загрузка приложения…</div><div id="bootErr"></div></div></div>
<div id="app"></div>
<script>
(function(){
  var boot=document.getElementById("boot"),msg=document.getElementById("bootMsg"),err=document.getElementById("bootErr");
  window.__speakflowBootError=function(e){
    if(boot)boot.style.display="flex";
    if(msg)msg.textContent="Ошибка запуска приложения. Я уже вижу её и могу исправить:";
    if(err){err.style.display="block";err.textContent=String(e&&e.stack||e||"Неизвестная ошибка");}
  };
  window.addEventListener("error",function(e){window.__speakflowBootError(e.error||e.message)});
  window.addEventListener("unhandledrejection",function(e){window.__speakflowBootError(e.reason)});
  window.__speakflowBootOk=function(){if(boot)boot.style.display="none"};
})();
</script>
<script src="app.js?v=35"></script>
<script src="personal36.js?v=36"></script>
<script src="phrasebank37.js?v=37"></script>
<script src="coach37.js?v=37"></script>
<script src="plan37.js?v=37"></script>
<script>
if(window.__speakflowBootOk && document.getElementById("app") && document.getElementById("app").innerHTML){
  window.__speakflowBootOk();
}
</script>
</body>
</html>
